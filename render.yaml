services:
  - type: web
    name: expense-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-db
          property: connectionString
      - key: EXTRACTOR_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
    diskSizeGB: 1
  - type: pserv
    name: expense-db
    plan: free
    databaseName: expense
    databaseUser: expense
