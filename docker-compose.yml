services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: expense
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Vision LLM (GLM-OCR via Ollama). Offline after one pull. Needs Docker GPU access
  # (Docker Desktop: Settings -> Resources -> enable GPU / WSL2 backend with
  # NVIDIA driver) and ~8GB RAM. Model pull (one time):
  #   docker compose --profile vision up -d
  #   docker compose exec ollama ollama pull glm-ocr
  # Then EXTRACTOR_PROVIDER=glmocr (0.9B, full GPU offload on 4GB cards).
  ollama:
    image: ollama/ollama:latest
    profiles: [vision]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/expense
      DATABASE_USERNAME: expense
      DATABASE_PASSWORD: expense
      DATABASE_DRIVER: org.postgresql.Driver
      EXTRACTOR_PROVIDER: ${EXTRACTOR_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OLLAMA_BASE_URL: http://ollama:11434
      GLMOCR_MODEL: ${GLMOCR_MODEL:-glm-ocr}
      # Cloud vision needs only GEMINI_API_KEY in .env (git-ignored, never committed).
    depends_on:
      - db

volumes:
  pgdata:
  ollama:
